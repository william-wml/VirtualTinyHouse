
name: Deploy VtH Interactive Model Explorer

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout VtH application
        uses: actions/checkout@v4
        with:
          ref: threejs-development

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: threejs/package-lock.json

      - name: Install dependencies
        working-directory: threejs
        run: npm ci

      - name: Build VtH viewer
        working-directory: threejs
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: threejs/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
